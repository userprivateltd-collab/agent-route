name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        working-directory: ./your-folder-name # <--- Change to your subfolder path
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: ./your-folder-name # <--- Change to your subfolder path
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: your-folder-name/app/build/outputs/apk/debug/app-debug.apk
